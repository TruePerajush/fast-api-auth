[project]
name = "my-fast-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Perajush",email = "perajush@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "structlog (>=26.1.0,<27.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=my_fast_api --cov-report=term-missing"
